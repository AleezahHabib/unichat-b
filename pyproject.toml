[project]
name = "unichat-backend"
version = "0.1.0"
description = "UniChat FastAPI backend application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "pyjwt>=2.15.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "openai>=3.0.0",
    "openai-agents>=0.22.0",
    "google-genai>=2.19.0",
    "slack_sdk>=3.44.0",
    "aiohttp>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "fakeredis>=2.23.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
